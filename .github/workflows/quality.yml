name: Quality Checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, chore/quality-checks]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product data
        run: npm run validate:data

      - name: Test persistence contract
        run: npm run test:persistence

      - name: Test catalog filters
        run: npm run test:catalog

      - name: Test product variant URLs
        run: npm run test:product-url

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
